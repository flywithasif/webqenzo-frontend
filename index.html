<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      WebQenzo — Premium Websites That Grow Your Business
    </title>

    <meta
      name="description"
      content="WebQenzo builds premium, modern and high-performance websites for businesses, brands and startups."
    />

    <meta
      name="keywords"
      content="WebQenzo, web development agency, website development, ecommerce website, business website, UI UX design, website redesign, web design agency"
    />

    <meta name="author" content="WebQenzo" />

    <!-- Search engine behaviour -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#05070B"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://webqenzo.com/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="WebQenzo — Websites That Grow Your Business"
    />

    <meta
      property="og:description"
      content="Premium websites, modern digital experiences and performance-focused web development by WebQenzo."
    />

    <meta
      property="og:url"
      content="https://webqenzo.com/"
    />

    <meta
      property="og:site_name"
      content="WebQenzo"
    />

    <!--
      Add your final social preview image later:
      public/og-image.jpg
    -->

    <meta
      property="og:image"
      content="https://webqenzo.com/og-image.jpg"
    />

    <meta
      property="og:image:alt"
      content="WebQenzo — Websites That Grow Your Business"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="WebQenzo — Websites That Grow Your Business"
    />

    <meta
      name="twitter:description"
      content="Premium websites and modern digital experiences built for growing businesses."
    />

    <meta
      name="twitter:image"
      content="https://webqenzo.com/og-image.jpg"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="src/assets/favicon.png"
    />

    <!-- Apple / mobile -->
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Performance -->
    <meta
      name="referrer"
      content="strict-origin-when-cross-origin"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
